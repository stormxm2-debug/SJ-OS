# SJ INVEST — 데스크톱 앱(.exe) 자동 배포
#
# package.json 의 version 을 올려 main 에 push 하면, Windows 설치본을 만들어
# GitHub Releases 에 올린다. 직원 PC의 앱은 electron-updater 로 자동 업데이트된다.
#
# **버전을 올렸을 때만 배포한다.** 앱은 autoDownload = true 라 릴리스가 올라가는 순간
# 직원 PC가 새 버전을 내려받기 시작한다. 그래서 push 한 번마다 배포하지 않고,
# "버전을 올린다"는 분명한 행동을 배포 스위치로 삼는다.
# 이미 같은 버전이 공개돼 있으면 아무 것도 하지 않는다(중복 배포 방지).
# 릴리스는 초안으로 먼저 만들고, 설치본과 latest.yml 이 모두 올라간 뒤에 공개한다 —
# 반쯤 올라간 릴리스가 직원 PC 에 보이지 않게 하기 위해서다.
#
# 배포하려면:
#   1) package.json 의 "version" 을 올린다 (예: 1.0.44 → 1.0.45)
#   2) main 에 push
#      (package.json 이 바뀐 push 에서만 깨어나고, 그중에서도 version 이 실제로
#       올라간 push 에서만 배포한다 — 스크립트만 고친 push 로는 배포되지 않는다)
#   → Actions 가 검사 → 빌드 → 릴리스까지 한다
#
# Secret 은 따로 등록할 필요가 없다. GitHub 가 주는 GITHUB_TOKEN 으로 릴리스를 만든다.
# 코드 서명 인증서는 아직 없어서, 설치 시 Windows SmartScreen 경고가 뜨는 것은 그대로다.

name: 데스크톱 앱 배포

on:
  push:
    branches: [main]
    # 버전은 package.json 에만 있다. 다른 파일만 고친 push 로는 배포되지 않는다.
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      force:
        description: '같은 버전의 릴리스가 이미 있어도 다시 만들기(기존 릴리스를 덮어씁니다)'
        type: boolean
        default: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 1단계 — 리눅스에서 빠르게 검사하고, 배포할 버전인지 판단한다.
  # (윈도우 러너는 느리고 비싸서, 배포가 확정된 뒤에만 쓴다)
  check:
    name: 검사 · 배포 여부 판단
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
      should_release: ${{ steps.decide.outputs.yes }}

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          # 이전 커밋의 package.json 을 읽어 버전이 실제로 올라갔는지 본다.
          fetch-depth: 0

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        # 검사 단계에는 Electron 바이너리(약 100MB)가 필요 없다.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 버전 읽기
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 배포할지 판단
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          skip() { echo "yes=false" >> "$GITHUB_OUTPUT"; echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go()   { echo "yes=true"  >> "$GITHUB_OUTPUT"; echo "$1"; }

          if [ "$FORCE" = "true" ]; then
            go "손으로 강제 실행 — v$VERSION 을 다시 만듭니다."
            exit 0
          fi

          # 1) 이 push 에서 version 이 실제로 바뀌었는지 본다.
          #    package.json 을 다른 이유로(스크립트 추가 등) 고친 push 로는 배포되지 않게.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            PREV=$(git show "$BEFORE:package.json" 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo '')
            if [ -n "$PREV" ] && [ "$PREV" = "$VERSION" ]; then
              skip "version 이 $VERSION 그대로입니다(이번 push 는 package.json 의 다른 부분만 바꿨습니다). 배포하지 않습니다."
            fi
            if [ -n "$PREV" ]; then echo "version $PREV → $VERSION"; fi
          fi

          # 2) 같은 버전이 이미 공개돼 있으면 중복 배포하지 않는다.
          #    초안(draft)은 지난 배포가 중간에 끊긴 흔적이므로, 막지 않고 다시 시도한다.
          DRAFT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo 'none')
          if [ "$DRAFT" = "false" ]; then
            skip "v$VERSION 릴리스가 이미 공개돼 있습니다. 배포하려면 package.json 의 version 을 올려서 push 하세요."
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "v$VERSION 초안 릴리스가 남아 있습니다 — 그 자리에 다시 올립니다."
          fi

          go "새 버전 v$VERSION — 배포합니다."

  # 2단계 — 윈도우에서 설치본을 만들어 GitHub Releases 에 올린다.
  release:
    name: 설치본 빌드 · 릴리스
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        # 여기서는 Electron 바이너리가 있어야 설치본을 만들 수 있다.
        run: npm ci

      # 릴리스 자리를 먼저 '초안' 으로 만들어 둔다.
      #
      # electron-builder 는 파일마다 업로더를 띄운다(.exe 와 .blockmap). 릴리스가 없으면
      # 둘이 동시에 릴리스를 만들려 들고, 진 쪽이 422 Validation Failed 로 빌드를 끝낸다.
      # v1.0.45 가 그렇게 .exe 만 올라가고 latest.yml 없이 공개돼, 직원 PC 가 자동
      # 업데이트를 보지 못했다. 자리를 미리 만들어 두면 둘 다 그 자리에 올리기만 한다.
      #
      # 초안으로 두는 이유: 파일이 다 올라가기 전에는 직원 PC 에 보이지 않아야 한다.
      - name: 릴리스 자리 만들기 (초안)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION 릴리스가 이미 있습니다 — 그 자리에 올립니다."
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "v$VERSION" \
              --notes "SJ INVEST v$VERSION"
          fi

      - name: 설치본 빌드 · 업로드
        # electron-builder 가 package.json 의 build.publish 설정(GitHub Releases)대로
        # 위에서 만든 초안 릴리스에 파일을 올린다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          npx electron-builder --win --publish always

      # 파일이 다 올라간 것을 확인한 뒤에만 공개한다.
      # latest.yml 이 없으면 직원 PC 의 앱이 새 버전을 알아채지 못한다(설치본만 덩그러니 남는다).
      - name: 릴리스 공개 (초안 → 공개)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          echo "올라간 파일:"; cat assets.txt
          grep -q '\.exe$'      assets.txt || { echo "::error::설치본(.exe)이 릴리스에 없습니다"; exit 1; }
          grep -q '^latest\.yml$' assets.txt || { echo "::error::latest.yml 이 없습니다 — 자동 업데이트가 동작하지 않습니다"; exit 1; }
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: 릴리스 결과
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "### 데스크톱 앱 v$VERSION 배포 완료"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo ""
            echo "직원 PC의 SJ INVEST 앱이 다음에 켜질 때 자동으로 새 버전을 내려받습니다."
            echo ""
            echo "새로 설치하는 PC는 위 릴리스의 \`SJ INVEST Setup $VERSION.exe\` 를 받으면 됩니다."
            echo "(코드 서명 인증서가 없어 설치 시 Windows SmartScreen 경고가 뜹니다 → 추가 정보 → 실행)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 설치본 보관 (릴리스 실패 대비)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sj-invest-setup-${{ needs.check.outputs.version }}
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: ignore
          retention-days: 30
