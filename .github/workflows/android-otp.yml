name: Android OTP APK

on:
  push:
    branches: [main]
    paths:
      - 'android-otp/**'
      - '.github/workflows/android-otp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 러너에는 Android SDK(플랫폼34·빌드툴34, 라이선스 수락됨)가
      # 이미 설치돼 있어 setup-android 액션 없이 바로 빌드한다(라이선스 단계 실패 회피).
      - name: Build debug APK
        working-directory: android-otp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sj-otp-apk
          path: android-otp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
