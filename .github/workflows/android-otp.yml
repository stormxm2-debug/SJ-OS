name: Android OTP APK

on:
  push:
    branches: [main]
    paths:
      - 'android-otp/**'
      - '.github/workflows/android-otp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-otp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sj-otp-apk
          path: android-otp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
